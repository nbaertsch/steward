$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

resources:
  - name: Steward endpoint
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    properties:
      executable: powershell.exe
      arguments:
        - -NoLogo
        - -NoProfile
        - -NonInteractive
        - -ExecutionPolicy
        - Bypass
        - -Command
        - |
          & {
            $ErrorActionPreference = 'Stop'
            $systemSid = [Security.Principal.SecurityIdentifier]::new(
              'S-1-5-18')
            $administratorsSid =
              [Security.Principal.SecurityIdentifier]::new('S-1-5-32-544')
            function Protect-StewardPath {
              param(
                [Parameter(Mandatory = $true)]
                [string]$Path,
                [Parameter(Mandatory = $true)]
                [bool]$Directory
              )
              $item = Get-Item -LiteralPath $Path -Force
              if (($item.Attributes -band
                  [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Steward protected path is a reparse point: $Path"
              }
              $security = if ($Directory) {
                [Security.AccessControl.DirectorySecurity]::new()
              } else {
                [Security.AccessControl.FileSecurity]::new()
              }
              $inheritance = if ($Directory) {
                [Security.AccessControl.InheritanceFlags]::ContainerInherit `
                  -bor [Security.AccessControl.InheritanceFlags]::ObjectInherit
              } else {
                [Security.AccessControl.InheritanceFlags]::None
              }
              $security.SetAccessRuleProtection($true, $false)
              $security.SetOwner($systemSid)
              foreach ($sid in @($systemSid, $administratorsSid)) {
                $security.AddAccessRule(
                  [Security.AccessControl.FileSystemAccessRule]::new(
                    $sid,
                    [Security.AccessControl.FileSystemRights]::FullControl,
                    $inheritance,
                    [Security.AccessControl.PropagationFlags]::None,
                    [Security.AccessControl.AccessControlType]::Allow))
              }
              Set-Acl -LiteralPath $Path -AclObject $security
              $actual = Get-Acl -LiteralPath $Path
              $ownerSid = ([Security.Principal.NTAccount]$actual.Owner).
                Translate([Security.Principal.SecurityIdentifier])
              $rules = @($actual.GetAccessRules(
                $true,
                $true,
                [Security.Principal.SecurityIdentifier]))
              $trusted = @($systemSid.Value, $administratorsSid.Value)
              if (-not $actual.AreAccessRulesProtected -or
                  $ownerSid.Value -ne $systemSid.Value -or
                  $rules.Count -ne 2 -or
                  $rules.Where({
                    $_.IdentityReference.Value -notin $trusted -or
                    $_.AccessControlType -ne
                      [Security.AccessControl.AccessControlType]::Allow -or
                    ($_.FileSystemRights -band
                      [Security.AccessControl.FileSystemRights]::FullControl) -ne
                      [Security.AccessControl.FileSystemRights]::FullControl
                  }).Count -ne 0) {
                throw "Steward protected path ACL verification failed: $Path"
              }
            }
            function Assert-StewardPath {
              param(
                [Parameter(Mandatory = $true)]
                [string]$Path
              )
              $item = Get-Item -LiteralPath $Path -Force
              if (($item.Attributes -band
                  [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "Steward trusted path is a reparse point: $Path"
              }
              $actual = Get-Acl -LiteralPath $Path
              $ownerSid = ([Security.Principal.NTAccount]$actual.Owner).
                Translate([Security.Principal.SecurityIdentifier])
              $rules = @($actual.GetAccessRules(
                $true,
                $true,
                [Security.Principal.SecurityIdentifier]))
              $trusted = @($systemSid.Value, $administratorsSid.Value)
              if (-not $actual.AreAccessRulesProtected -or
                  $ownerSid.Value -ne $systemSid.Value -or
                  $rules.Count -ne 2 -or
                  $rules.Where({
                    $_.IdentityReference.Value -notin $trusted -or
                    $_.AccessControlType -ne
                      [Security.AccessControl.AccessControlType]::Allow -or
                    ($_.FileSystemRights -band
                      [Security.AccessControl.FileSystemRights]::FullControl) -ne
                      [Security.AccessControl.FileSystemRights]::FullControl
                  }).Count -ne 0) {
                throw "Steward trusted path ACL verification failed: $Path"
              }
            }
            $programDataItem = Get-Item -LiteralPath $env:ProgramData -Force
            if (($programDataItem.Attributes -band
                [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'ProgramData cannot be a reparse point.'
            }
            $stewardRoot = Join-Path $env:ProgramData 'Steward'
            $installRoot = Join-Path $stewardRoot 'install'
            $handoffRoot = Join-Path $stewardRoot 'handoff'
            Protect-StewardPath -Path $stewardRoot -Directory $true
            Protect-StewardPath -Path $installRoot -Directory $true
            Protect-StewardPath -Path $handoffRoot -Directory $true
            $argumentPath = Join-Path $handoffRoot 'bootstrap-args.json'
            if (-not (Test-Path -LiteralPath $argumentPath -PathType Leaf)) {
              throw 'Steward endpoint bootstrap arguments are missing.'
            }
            Assert-StewardPath -Path $argumentPath
            if (([DateTime]::UtcNow -
                (Get-Item -LiteralPath $argumentPath).LastWriteTimeUtc) -gt
                [TimeSpan]::FromMinutes(10)) {
              throw 'Steward endpoint bootstrap arguments are stale.'
            }
            $argumentStream = [IO.File]::Open(
              $argumentPath,
              [IO.FileMode]::Open,
              [IO.FileAccess]::Read,
              [IO.FileShare]::None)
            try {
              $reader = [IO.StreamReader]::new(
                $argumentStream,
                [Text.Encoding]::UTF8,
                $true)
              try {
                $argumentJson = $reader.ReadToEnd()
              } finally {
                $reader.Dispose()
              }
            } finally {
              $argumentStream.Dispose()
            }
            $arguments = $argumentJson | ConvertFrom-Json
            $required = @(
              'releaseAssetUrl',
              'bootstrapEncryptionPublicKeyBase64',
              'controlSigningPublicKeyBase64',
              'controlIdentity',
              'nodeUserAccount',
              'nodeUserSid'
            )
            foreach ($name in $required) {
              if ([string]::IsNullOrWhiteSpace([string]$arguments.$name)) {
                throw "Steward endpoint bootstrap argument '$name' is missing."
              }
            }
            $bootstrapPath = Join-Path $installRoot (
              'Install-Steward-' + [guid]::NewGuid().ToString('N') + '.ps1')
            try {
              Add-Type -AssemblyName System.Net.Http
              $handler = [Net.Http.HttpClientHandler]::new()
              $handler.AllowAutoRedirect = $false
              $client = [Net.Http.HttpClient]::new($handler)
              $client.Timeout = [TimeSpan]::FromMinutes(2)
              try {
                $uri = [uri]'https://raw.githubusercontent.com/nbaertsch/steward/5a86851e43949eada5b4d126217379509fea21a4/catalog/devbox/steward-endpoint/Install-Steward.ps1'
                $response = $client.GetAsync(
                  $uri,
                  [Net.Http.HttpCompletionOption]::ResponseHeadersRead
                ).GetAwaiter().GetResult()
                [void]$response.EnsureSuccessStatusCode()
                if ($response.RequestMessage.RequestUri -ne $uri) {
                  throw 'Steward endpoint bootstrap download redirected.'
                }
                $input = $response.Content.ReadAsStreamAsync().
                  GetAwaiter().GetResult()
                $output = [IO.File]::Open(
                  $bootstrapPath,
                  [IO.FileMode]::CreateNew,
                  [IO.FileAccess]::Write,
                  [IO.FileShare]::None)
                try {
                  $buffer = [byte[]]::new(65536)
                  $total = 0L
                  while (($read = $input.Read(
                      $buffer, 0, $buffer.Length)) -gt 0) {
                    $total += $read
                    if ($total -gt 1048576) {
                      throw 'Steward endpoint bootstrap exceeds its size bound.'
                    }
                    $output.Write($buffer, 0, $read)
                  }
                } finally {
                  $output.Dispose()
                  $input.Dispose()
                }
              } finally {
                $client.Dispose()
                $handler.Dispose()
              }
              if ((Get-FileHash -LiteralPath $bootstrapPath -Algorithm SHA256).Hash -ne
                  '0E11616601CA0C3831ACB820434A1D74ABCE9E6BB4E195F4949197571874C8C9') {
                throw 'Steward endpoint bootstrap script hash mismatch.'
              }
              $content = Get-Content -LiteralPath $bootstrapPath -Raw
              $content = $content.
                Replace('__STEWARD_APPROVED_SOURCE_REPOSITORY__', 'nbaertsch/steward').
                Replace(
                  '__STEWARD_APPROVED_SIGNER_WORKFLOW__',
                  'nbaertsch/steward/.github/workflows/release-endpoint.yml')
              Set-Content -LiteralPath $bootstrapPath -Value $content `
                -Encoding utf8
              & $bootstrapPath `
                -ReleaseAssetUrl $arguments.releaseAssetUrl `
                -BootstrapEncryptionPublicKeyBase64 `
                  $arguments.bootstrapEncryptionPublicKeyBase64 `
                -ControlSigningPublicKeyBase64 `
                  $arguments.controlSigningPublicKeyBase64 `
                -ControlIdentity $arguments.controlIdentity `
                -NodeUserAccount $arguments.nodeUserAccount `
                -NodeUserSid $arguments.nodeUserSid `
                -AdministrativeRoot (
                  Join-Path $env:ProgramData 'Steward\install\Runtime\1.0.20')
            } finally {
              Remove-Item -LiteralPath $bootstrapPath -Force `
                -ErrorAction SilentlyContinue
            }
          }
