name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore
        run: dotnet restore Steward.slnx

      - name: Build
        run: dotnet build Steward.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Steward.slnx --configuration Release --no-build --no-restore -m:1

      - name: Audit dependencies
        shell: pwsh
        run: |
          $output = dotnet list Steward.slnx package --vulnerable --include-transitive
          $output
          if ($LASTEXITCODE -ne 0 -or $output -match 'has the following vulnerable packages') {
            exit 1
          }
