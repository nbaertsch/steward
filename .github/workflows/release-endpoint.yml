name: Release Steward Endpoint

on:
  workflow_dispatch:
    inputs:
      version:
        description: MSI product version
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verified secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --only-verified

  build-attest:
    needs: secret-scan
    runs-on: windows-latest
    timeout-minutes: 90
    environment: steward-endpoint-release
    env:
      STEWARD_1_0_23_RELEASE_INPUT: ${{ vars.STEWARD_1_0_23_RELEASE_INPUT }}

    steps:
      - name: Require public repository
        shell: pwsh
        run: |
          if ('${{ github.event.repository.private }}' -ne 'false') {
            throw 'Steward endpoint releases require the approved public repository.'
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Build.targets
            global.json

      - name: Restore complete production dependency graph
        shell: pwsh
        run: dotnet restore Steward.slnx

      - name: Targeted installer maintenance and endpoint tests
        shell: pwsh
        run: |
          dotnet test tests\Steward.Maintenance.Windows.Tests\Steward.Maintenance.Windows.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test tests\Steward.Endpoint.Provisioner.Tests\Steward.Endpoint.Provisioner.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test tests\Steward.RdpDvc.Server.Windows.Tests\Steward.RdpDvc.Server.Windows.Tests.csproj --configuration Release --no-restore --verbosity minimal
      - name: Isolated Release build with warnings as errors
        shell: pwsh
        run: dotnet build Steward.slnx --configuration Release --no-restore /warnaserror

      - name: Complete production dependency tests
        shell: pwsh
        run: dotnet test Steward.slnx --configuration Release --no-build --no-restore --verbosity minimal -m:1

      - name: Format verification
        shell: pwsh
        run: dotnet format Steward.slnx --verify-no-changes --no-restore

      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          $audit = dotnet list Steward.slnx package --vulnerable --include-transitive
          $audit | Write-Output
          if ($LASTEXITCODE -ne 0 -or
              ($audit -join "`n") -match 'has the following vulnerable packages') {
            throw 'Dependency vulnerability audit failed closed.'
          }

      - name: Build endpoint catalog
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release version must be a three-part numeric version.'
          }
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Endpoint releases must be built from main.'
          }
          .\scripts\Build-StewardEndpointMsi.ps1 `
            -Version $env:VERSION `
            -OutputDirectory '${{ runner.temp }}\steward-endpoint' `
            -SourceRepository '${{ github.repository }}' `
            -SourceCommit '${{ github.sha }}' `
            -SourceRef '${{ github.ref }}' `
            -SignerWorkflow '${{ github.repository }}/.github/workflows/release-endpoint.yml' `
            -SourceRunId '${{ github.run_id }}'
          .\scripts\Build-StewardEndpointCatalogBootstrap.ps1 `
            -SourceRepository '${{ github.repository }}' `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\steward-endpoint\bootstrap'
          Compress-Archive `
            -Path '${{ runner.temp }}\steward-endpoint\bootstrap\*' `
            -DestinationPath '${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Bootstrap.${{ inputs.version }}.zip'

      - name: Actual MSI packaging smoke
        shell: pwsh
        run: |
          .\scripts\Test-StewardEndpointMsi.ps1 `
            -CatalogDirectory '${{ runner.temp }}\steward-endpoint\catalog'

      - name: Require authentic Steward 1.0.23 release input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $input = $env:STEWARD_1_0_23_RELEASE_INPUT
          if ([string]::IsNullOrWhiteSpace($input)) {
            throw 'Authentic Steward 1.0.23 release input is required as owner/repository@tag#sha256; no fixture is fabricated.'
          }
          if ($input -notmatch '^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([^#\s]+)#([0-9A-Fa-f]{64})$') {
            throw 'STEWARD_1_0_23_RELEASE_INPUT must be owner/repository@tag#sha256.'
          }
          $repository = $Matches[1]
          $tag = $Matches[2]
          $expectedHash = $Matches[3]
          $download = '${{ runner.temp }}\steward-1.0.23-download'
          $expanded = '${{ runner.temp }}\steward-1.0.23-catalog'
          New-Item -ItemType Directory -Path $download, $expanded -Force | Out-Null
          gh release download $tag --repo $repository `
            --pattern 'Steward.Endpoint.Catalog.1.0.23.zip' `
            --dir $download
          if ($LASTEXITCODE -ne 0) {
            throw 'Authentic Steward 1.0.23 release archive could not be downloaded.'
          }
          $archive = Get-ChildItem $download -Filter '*.zip' -File -ErrorAction Stop |
            Select-Object -Single
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne
              $expectedHash) {
            throw 'Authentic Steward 1.0.23 release archive hash mismatch.'
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $manifest = Get-ChildItem $expanded `
            -Filter 'steward-endpoint.release.psd1' -File -Recurse |
            Select-Object -Single
          $catalog = Split-Path -Parent $manifest.FullName
          $release = Import-PowerShellDataFile $manifest.FullName
          if ($release.ProductVersion -ne '1.0.23') {
            throw 'External migration input is not Steward endpoint 1.0.23.'
          }
          "STEWARD_LEGACY_CATALOG=$catalog" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean install repair real 1.0.23 upgrade failed activation rollback second upgrade
        shell: pwsh
        run: |
          $rsa = [Security.Cryptography.RSA]::Create(3072)
          $control = [Security.Cryptography.ECDsa]::Create(
            [Security.Cryptography.ECCurve]::NamedCurves.nistP256)
          try {
            $bootstrap = [Convert]::ToBase64String(
              $rsa.ExportSubjectPublicKeyInfo())
            $controlPublic = [Convert]::ToBase64String(
              $control.ExportSubjectPublicKeyInfo())
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            .\scripts\Test-StewardEndpointMsi.ps1 `
              -CatalogDirectory '${{ runner.temp }}\steward-endpoint\catalog' `
              -LegacyCatalogDirectory $env:STEWARD_LEGACY_CATALOG `
              -BootstrapEncryptionPublicKeyBase64 $bootstrap `
              -ControlSigningPublicKeyBase64 $controlPublic `
              -ControlIdentity 'steward.control.release-gate' `
              -NodeUserAccount $identity.Name `
              -NodeUserSid $identity.User.Value `
              -Machine
          } finally {
            $rsa.Dispose()
            $control.Dispose()
          }

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}\steward-endpoint\catalog
          format: spdx-json
          output-file: ${{ runner.temp }}\steward-endpoint\steward-endpoint.spdx.json

      - name: Build attestation subject list
        shell: pwsh
        run: |
          $catalog = '${{ runner.temp }}\steward-endpoint\catalog'
          $subjects = @(
            'Steward.Endpoint.Msi.msi',
            'steward-endpoint.release.psd1')
          $lines = foreach ($name in $subjects) {
            $hash = (Get-FileHash (Join-Path $catalog $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$name"
          }
          Set-Content -LiteralPath (
            '${{ runner.temp }}\steward-endpoint\catalog.subjects.sha256') `
            -Value $lines -Encoding ascii

      - name: Attest endpoint release subjects
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}\steward-endpoint\catalog.subjects.sha256

      - name: Preserve and verify catalog provenance and hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $catalog = '${{ runner.temp }}\steward-endpoint\catalog'
          $bundle = Join-Path $catalog 'Steward.Endpoint.Msi.sigstore.json'
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination $bundle
          $release = Import-PowerShellDataFile (
            Join-Path $catalog 'steward-endpoint.release.psd1')
          if ($release.CatalogIdentity -ne
              'steward-endpoint/${{ inputs.version }}/${{ github.run_id }}') {
            throw 'Catalog identity does not match the immutable release run.'
          }
          foreach ($name in @(
            'Steward.Endpoint.Msi.msi',
            'steward-endpoint.release.psd1')) {
            gh attestation verify `
              (Join-Path $catalog $name) `
              --bundle $bundle `
              --repo '${{ github.repository }}' `
              --signer-workflow '${{ github.repository }}/.github/workflows/release-endpoint.yml' `
              --signer-digest '${{ github.sha }}' `
              --source-digest '${{ github.sha }}' `
              --source-ref '${{ github.ref }}' `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "Attestation self-verification failed for $name."
            }
          }

      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION
          $catalog = '${{ runner.temp }}\steward-endpoint\catalog'
          $archive = Join-Path '${{ runner.temp }}\steward-endpoint' (
            "Steward.Endpoint.Catalog.$version.zip")
          $releaseFiles = @(
            'Steward.Endpoint.Msi.msi',
            'Steward.Endpoint.Msi.sigstore.json',
            'steward-endpoint.release.psd1') |
            ForEach-Object { Join-Path $catalog $_ }
          Compress-Archive -LiteralPath $releaseFiles -DestinationPath $archive
          $tag = "steward-endpoint-v$version"
          gh release create $tag `
            $archive `
            '${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Bootstrap.${{ inputs.version }}.zip' `
            '${{ runner.temp }}\steward-endpoint\steward-endpoint.spdx.json' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Steward Endpoint $version" `
            --notes "CI-attested Steward endpoint bootstrap." `
            --latest=false

      - name: Upload attested catalog archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steward-endpoint-${{ inputs.version }}
          path: |
            ${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Catalog.${{ inputs.version }}.zip
            ${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Bootstrap.${{ inputs.version }}.zip
            ${{ runner.temp }}\steward-endpoint\steward-endpoint.spdx.json
          if-no-files-found: error
          retention-days: 30
