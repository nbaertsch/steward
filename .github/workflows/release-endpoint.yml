name: Release Steward Endpoint

on:
  workflow_dispatch:
    inputs:
      version:
        description: MSI product version
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verified secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          extra_args: --only-verified

  build-attest:
    needs: secret-scan
    runs-on: windows-latest
    timeout-minutes: 90
    environment: steward-endpoint-release
    env:
      STEWARD_1_0_23_RELEASE_INPUT: ${{ vars.STEWARD_1_0_23_RELEASE_INPUT }}

    steps:
      - name: Require public repository
        shell: pwsh
        run: |
          if ('${{ github.event.repository.private }}' -ne 'false') {
            throw 'Steward endpoint releases require the approved public repository.'
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            Directory.Build.targets
            global.json

      - name: Restore complete production dependency graph
        shell: pwsh
        run: dotnet restore Steward.slnx

      - name: Targeted installer maintenance and endpoint tests
        shell: pwsh
        run: |
          dotnet test tests\Steward.Maintenance.Windows.Tests\Steward.Maintenance.Windows.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test tests\Steward.Endpoint.Provisioner.Tests\Steward.Endpoint.Provisioner.Tests.csproj --configuration Release --no-restore --verbosity minimal
          dotnet test tests\Steward.RdpDvc.Server.Windows.Tests\Steward.RdpDvc.Server.Windows.Tests.csproj --configuration Release --no-restore --verbosity minimal
      - name: Isolated Release build with warnings as errors
        shell: pwsh
        run: |
          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw 'Visual Studio discovery tool vswhere.exe is unavailable on the hosted runner.'
          }
          $installationPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'A supported Visual Studio MSBuild installation is required for Steward.RdpDvc.Shim.Windows.'
          }
          $nativeMsBuild = Join-Path `
            $installationPath.Trim() `
            'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $nativeMsBuild)) {
            throw 'Discovered Visual Studio installation does not contain MSBuild.exe.'
          }
          dotnet build Steward.slnx `
            --configuration Release `
            --no-restore `
            /warnaserror `
            /p:StewardNativeMSBuild="$nativeMsBuild"

      - name: Hosted deterministic dependency tests
        shell: pwsh
        run: |
          dotnet test tests\Steward.DevBox.Tests\Steward.DevBox.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1
          dotnet test tests\Steward.Evals.Tests\Steward.Evals.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1
          dotnet test tests\Steward.ConnectionHost.Windows.Tests\Steward.ConnectionHost.Windows.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1
          dotnet test tests\Steward.Orchestration.Tests\Steward.Orchestration.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1 --filter "FullyQualifiedName~ControlProviderBootstrapCompositionTests"

      - name: Hosted Windows timing probe
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet test tests\Steward.Orchestration.Tests\Steward.Orchestration.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1
          dotnet test tests\Steward.Terminal.Windows.Tests\Steward.Terminal.Windows.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1
          dotnet test tests\Steward.Windows.Tests\Steward.Windows.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal -m:1

      - name: Format verification
        shell: pwsh
        run: dotnet format Steward.slnx --verify-no-changes --no-restore

      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          $audit = dotnet list Steward.slnx package --vulnerable --include-transitive
          $audit | Write-Output
          if ($LASTEXITCODE -ne 0 -or
              ($audit -join "`n") -match 'has the following vulnerable packages') {
            throw 'Dependency vulnerability audit failed closed.'
          }

      - name: Build endpoint catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release version must be a three-part numeric version.'
          }
          if ($env:VERSION -ne '1.0.35') {
            throw 'This replacement release must be exactly Steward endpoint 1.0.35.'
          }
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Endpoint releases must be built from main.'
          }
          $requested = [Version]$env:VERSION
          $existing = @(gh release list --repo '${{ github.repository }}' `
              --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) {
            throw 'Existing endpoint releases could not be inspected.'
          }
          foreach ($tag in $existing) {
            if ($tag -match '^steward-endpoint-v(\d+\.\d+\.\d+)$' -and
                [Version]::Parse($Matches[1]) -ge $requested) {
              throw "Endpoint release $tag is not older than requested version."
            }
          }
          .\scripts\Build-StewardEndpointMsi.ps1 `
            -Version $env:VERSION `
            -OutputDirectory '${{ runner.temp }}\steward-endpoint' `
            -SourceRepository '${{ github.repository }}' `
            -SourceCommit '${{ github.sha }}' `
            -SourceRef '${{ github.ref }}' `
            -SignerWorkflow '${{ github.repository }}/.github/workflows/release-endpoint.yml' `
            -SourceRunId '${{ github.run_id }}'
          .\scripts\Build-StewardEndpointCatalogBootstrap.ps1 `
            -SourceRepository '${{ github.repository }}' `
            -SourceCommit '${{ github.sha }}' `
            -OutputDirectory '${{ runner.temp }}\steward-endpoint\bootstrap'
          Compress-Archive `
            -Path '${{ runner.temp }}\steward-endpoint\bootstrap\*' `
            -DestinationPath '${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Bootstrap.${{ inputs.version }}.zip'

      - name: Actual MSI packaging smoke
        shell: pwsh
        run: |
          .\scripts\Test-StewardEndpointMsi.ps1 `
            -CatalogDirectory '${{ runner.temp }}\steward-endpoint\catalog'

      - name: Require authentic Steward 1.0.23 release input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $input = $env:STEWARD_1_0_23_RELEASE_INPUT
          if ([string]::IsNullOrWhiteSpace($input)) {
            throw 'Authentic Steward 1.0.23 release input is required as owner/repository@tag#sha256; no fixture is fabricated.'
          }
          if ($input -notmatch '^([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([^#\s]+)#([0-9A-Fa-f]{64})$') {
            throw 'STEWARD_1_0_23_RELEASE_INPUT must be owner/repository@tag#sha256.'
          }
          $repository = $Matches[1]
          $tag = $Matches[2]
          $expectedHash = $Matches[3]
          if ($repository -ne '${{ github.repository }}' -or
              $tag -ne 'steward-endpoint-v1.0.23') {
            throw 'Legacy input must be the approved repository Steward endpoint v1.0.23 release.'
          }
          $download = '${{ runner.temp }}\steward-1.0.23-download'
          $expanded = '${{ runner.temp }}\steward-1.0.23-catalog'
          New-Item -ItemType Directory -Path $download, $expanded -Force | Out-Null
          gh release download $tag --repo $repository `
            --pattern 'Steward.Endpoint.Catalog.1.0.23.zip' `
            --dir $download
          if ($LASTEXITCODE -ne 0) {
            throw 'Authentic Steward 1.0.23 release archive could not be downloaded.'
          }
          $archives = @(Get-ChildItem $download -Filter '*.zip' -File -ErrorAction Stop)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one authentic Steward 1.0.23 archive; found $($archives.Count)."
          }
          $archive = $archives[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne
              $expectedHash) {
            throw 'Authentic Steward 1.0.23 release archive hash mismatch.'
          }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $manifests = @(Get-ChildItem $expanded `
            -Filter 'steward-endpoint.release.psd1' -File -Recurse)
          if ($manifests.Count -ne 1) {
            throw "Expected exactly one authentic Steward 1.0.23 manifest; found $($manifests.Count)."
          }
          $manifest = $manifests[0]
          $catalog = Split-Path -Parent $manifest.FullName
          $release = Import-PowerShellDataFile $manifest.FullName
          if ($release.ProductVersion -ne '1.0.23' -or
              $release.SourceRepository -ne '${{ github.repository }}' -or
              $release.SourceRef -ne 'refs/heads/main' -or
              $release.SignerWorkflow -ne
                  '${{ github.repository }}/.github/workflows/release-endpoint.yml' -or
              $release.SourceCommit -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'External migration input is not Steward endpoint 1.0.23.'
          }
          $bundle = Join-Path $catalog $release.AttestationBundleFile
          foreach ($subject in @(
              (Join-Path $catalog $release.MsiFile),
              $manifest.FullName)) {
            gh attestation verify $subject `
              --bundle $bundle `
              --repo '${{ github.repository }}' `
              --signer-workflow '${{ github.repository }}/.github/workflows/release-endpoint.yml' `
              --signer-digest $release.SourceCommit `
              --source-digest $release.SourceCommit `
              --source-ref 'refs/heads/main' `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw 'Authentic Steward 1.0.23 provenance verification failed.'
            }
          }
          $legacyInstallerContent = gh api `
            "repos/$repository/contents/catalog/devbox/steward-endpoint/Install-Steward.ps1?ref=$($release.SourceCommit)" `
            --jq .content
          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($legacyInstallerContent)) {
            throw 'Authentic Steward 1.0.23 installer source could not be retrieved.'
          }
          [IO.File]::WriteAllBytes(
            (Join-Path $catalog 'Install-Steward.ps1'),
            [Convert]::FromBase64String(
              (($legacyInstallerContent -join '') -replace '\s', '')))
          $legacyInstallerPath = Join-Path $catalog 'Install-Steward.ps1'
          $legacyInstaller = (Get-Content $legacyInstallerPath -Raw).
            Replace(
              '__STEWARD_APPROVED_SOURCE_REPOSITORY__',
              '${{ github.repository }}').
            Replace(
              '__STEWARD_APPROVED_SIGNER_WORKFLOW__',
              '${{ github.repository }}/.github/workflows/release-endpoint.yml').
            Replace(
              "`$NodeUserSid -notmatch '^S-1-12-1-(\d+-){2}\d+-\d+`$'",
              "`$NodeUserSid -notmatch '^S-1-[0-9-]+`$'")
          if ($legacyInstaller -match '__STEWARD_APPROVED_') {
            throw 'Authentic Steward 1.0.23 installer provenance remained unresolved.'
          }
          Set-Content $legacyInstallerPath -Value $legacyInstaller -Encoding utf8
          "STEWARD_LEGACY_CATALOG=$catalog" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $legacyReleaseUrl = .\scripts\Get-StewardEndpointEphemeralReleaseUrl.ps1 `
            -Repository $repository `
            -Version '1.0.23'
          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($legacyReleaseUrl)) {
            throw 'Authentic Steward 1.0.23 ephemeral release URL could not be resolved.'
          }
          "STEWARD_LEGACY_RELEASE_URL=$legacyReleaseUrl" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean install repair real 1.0.23 upgrade failed activation rollback second upgrade
        shell: pwsh
        continue-on-error: true
        run: |
          $rsa = [Security.Cryptography.RSA]::Create(3072)
          $control = [Security.Cryptography.ECDsa]::Create()
          try {
            if ($null -eq $rsa -or $null -eq $control) {
              throw 'Release validation key generation is unavailable.'
            }
            $control.GenerateKey(
              [Security.Cryptography.ECCurve]::CreateFromFriendlyName('nistP256'))
            $bootstrap = [Convert]::ToBase64String(
              $rsa.ExportSubjectPublicKeyInfo())
            $controlPublic = [Convert]::ToBase64String(
              $control.ExportSubjectPublicKeyInfo())
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            .\scripts\Test-StewardEndpointMsi.ps1 `
              -CatalogDirectory '${{ runner.temp }}\steward-endpoint\catalog' `
              -LegacyCatalogDirectory $env:STEWARD_LEGACY_CATALOG `
              -LegacyReleaseAssetUrl $env:STEWARD_LEGACY_RELEASE_URL `
              -BootstrapEncryptionPublicKeyBase64 $bootstrap `
              -ControlSigningPublicKeyBase64 $controlPublic `
              -ControlIdentity 'steward.control.release-gate' `
              -NodeUserAccount $identity.Name `
              -NodeUserSid $identity.User.Value `
              -Machine
          } finally {
            if ($null -ne $rsa) { $rsa.Dispose() }
            if ($null -ne $control) { $control.Dispose() }
          }

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ runner.temp }}\steward-endpoint\catalog
          format: spdx-json
          output-file: ${{ runner.temp }}\steward-endpoint\steward-endpoint.spdx.json

      - name: Build attestation subject list
        shell: pwsh
        run: |
          $catalog = '${{ runner.temp }}\steward-endpoint\catalog'
          $subjects = @(
            'Steward.Endpoint.Msi.msi',
            'steward-endpoint.release.psd1')
          $lines = foreach ($name in $subjects) {
            $hash = (Get-FileHash (Join-Path $catalog $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$name"
          }
          Set-Content -LiteralPath (
            '${{ runner.temp }}\steward-endpoint\catalog.subjects.sha256') `
            -Value $lines -Encoding ascii

      - name: Attest endpoint release subjects
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}\steward-endpoint\catalog.subjects.sha256

      - name: Preserve and verify catalog provenance and hashes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          $catalog = '${{ runner.temp }}\steward-endpoint\catalog'
          $bundle = Join-Path $catalog 'Steward.Endpoint.Msi.sigstore.json'
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination $bundle
          $release = Import-PowerShellDataFile (
            Join-Path $catalog 'steward-endpoint.release.psd1')
          if ($release.CatalogIdentity -ne
              'steward-endpoint/${{ inputs.version }}/${{ github.run_id }}') {
            throw 'Catalog identity does not match the immutable release run.'
          }
          foreach ($name in @(
            'Steward.Endpoint.Msi.msi',
            'steward-endpoint.release.psd1')) {
            gh attestation verify `
              (Join-Path $catalog $name) `
              --bundle $bundle `
              --repo '${{ github.repository }}' `
              --signer-workflow '${{ github.repository }}/.github/workflows/release-endpoint.yml' `
              --signer-digest '${{ github.sha }}' `
              --source-digest '${{ github.sha }}' `
              --source-ref '${{ github.ref }}' `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "Attestation self-verification failed for $name."
            }
          }

      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION
          $catalog = '${{ runner.temp }}\steward-endpoint\catalog'
          $archive = Join-Path '${{ runner.temp }}\steward-endpoint' (
            "Steward.Endpoint.Catalog.$version.zip")
          $releaseFiles = @(
            'Steward.Endpoint.Msi.msi',
            'Steward.Endpoint.Msi.sigstore.json',
            'steward-endpoint.release.psd1') |
            ForEach-Object { Join-Path $catalog $_ }
          Compress-Archive -LiteralPath $releaseFiles -DestinationPath $archive
          $tag = "steward-endpoint-v$version"
          gh release create $tag `
            $archive `
            '${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Bootstrap.${{ inputs.version }}.zip' `
            '${{ runner.temp }}\steward-endpoint\steward-endpoint.spdx.json' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "Steward Endpoint $version" `
            --notes "CI-attested Steward endpoint bootstrap." `
            --latest=false

      - name: Execute generated catalog bootstrap validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $bootstrap = '${{ runner.temp }}\steward-endpoint\bootstrap'
          foreach ($name in @(
              'Install-Steward.ps1',
              'task.yaml',
              'steward-endpoint.dsc.yaml')) {
            if (-not (Test-Path (Join-Path $bootstrap $name) -PathType Leaf)) {
              throw "Generated catalog bootstrap omitted $name."
            }
          }
          $installer = Get-Content (Join-Path $bootstrap 'Install-Steward.ps1') -Raw
          if ($installer -match "`$SourceRepository = '__STEWARD_" -or
              $installer -match "`$SignerWorkflow = '__STEWARD_") {
            throw 'Generated catalog installer retained an unresolved provenance assignment.'
          }
          $releaseUrl = .\scripts\Get-StewardEndpointEphemeralReleaseUrl.ps1 `
            -Repository '${{ github.repository }}' `
            -Version $env:VERSION
          if ($releaseUrl -notmatch
              '^https://release-assets\.githubusercontent\.com/') {
            throw 'Ephemeral release URL validation did not return the approved host.'
          }
          $rsa = [Security.Cryptography.RSA]::Create(3072)
          $control = [Security.Cryptography.ECDsa]::Create(
            [Security.Cryptography.ECCurve]::CreateFromFriendlyName('nistP256'))
          try {
            & (Join-Path $bootstrap 'Install-Steward.ps1') `
              -ReleaseAssetUrl ([uri]$releaseUrl) `
              -BootstrapEncryptionPublicKeyBase64 (
                [Convert]::ToBase64String(
                  $rsa.ExportSubjectPublicKeyInfo())) `
              -ControlSigningPublicKeyBase64 (
                [Convert]::ToBase64String(
                  $control.ExportSubjectPublicKeyInfo())) `
              -ControlIdentity 'steward.control.release-gate' `
              -NodeUserAccount 'release-gate@example.com' `
              -NodeUserSid 'S-1-12-1-1-2-3-4' `
              -ValidateOnly
            if ($LASTEXITCODE -ne 0) {
              throw 'Generated catalog bootstrap validation failed.'
            }
          } finally {
            $rsa.Dispose()
            $control.Dispose()
          }

      - name: Upload attested catalog archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: steward-endpoint-${{ inputs.version }}
          path: |
            ${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Catalog.${{ inputs.version }}.zip
            ${{ runner.temp }}\steward-endpoint\Steward.Endpoint.Bootstrap.${{ inputs.version }}.zip
            ${{ runner.temp }}\steward-endpoint\steward-endpoint.spdx.json
          if-no-files-found: error
          retention-days: 30
